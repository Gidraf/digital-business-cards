# =============================================================================
#  /etc/nginx/sites-available/cards.gidraf.dev.conf
#
#  One domain, two apps (microfrontend-style path routing):
#
#    /cards/*   → Cards & Print   (Next.js, 127.0.0.1:7500, basePath "/cards")
#    /*         → Reactive Resume (Hono + TanStack, 127.0.0.1:3000)
#
#  Reactive Resume owns the root because it claims a lot of top-level paths
#  (/auth/*, /api/auth/*, /dashboard, /builder, /uploads, /mcp, /.well-known)
#  and has no base-path support — keeping it at the root means we never have to
#  patch upstream files, so syncing with upstream stays cheap.
#
#  The /cards prefix is NOT stripped: Next is built with basePath "/cards" and
#  emits its own asset URLs under /cards/_next/..., so it must see the prefix.
#
#  HTTP-only on purpose: run certbot afterwards and it appends the 443 block
#  and the http→https redirect itself.
#  Install/update with:  ./deploy/deploy.sh bootstrap
#  (it backs up the existing file and reinstalls TLS; certbot's 443 block
#   lives in the installed copy, not here)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cards.gidraf.dev;

    # Resume imports (PDF/DOCX) and print sheets are the big uploads here.
    client_max_body_size 60m;

    # CVPAP is the only login channel: the bare root goes to the chooser, which
    # bounces to /cards/login when there is no session. Reactive Resume's own
    # login page stays reachable at /auth/login as an admin fallback.
    location = / {
        return 302 /cards/choose;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ── Cards & Print ────────────────────────────────────────────────────────
    # Immutable hashed build assets.
    location /cards/_next/static/ {
        proxy_pass http://127.0.0.1:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /cards {
        proxy_pass http://127.0.0.1:7500;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # streamed RSC payloads must not sit in a buffer
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Reactive Resume ──────────────────────────────────────────────────────
    # Revamp progress is Server-Sent Events: no buffering, long-lived.
    location /api/v1/revamp/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# `Connection: upgrade` only when the client asked for it. If a map with this
# name already exists in another site file, delete these 4 lines — nginx
# refuses duplicate map names.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
