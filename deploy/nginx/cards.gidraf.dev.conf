# =============================================================================
#  /etc/nginx/sites-available/cards.gidraf.dev
#  Cards & Print (Next.js standalone) → 127.0.0.1:7500
#
#  HTTP-only on purpose: run certbot after this is live and it appends the
#  443 server block + the http→https redirect itself (see README / deploy notes).
#  Apply:  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cards.gidraf.dev;

    # Card/flyer artwork is uploaded straight to the CVPAP API, not through
    # here — this only needs headroom for the app's own route handlers.
    client_max_body_size 25m;

    # Let Certbot answer the ACME challenge from disk if it ever uses --webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Immutable build assets — safe to cache hard (hashed filenames).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # App: pages, server actions, /api/auth, /auth/sso, /api/proxy-image.
    location / {
        proxy_pass http://127.0.0.1:7500;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # HMR in dev / future websockets; harmless in production.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streamed RSC payloads must not sit in a buffer.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# `Connection: upgrade` only when the client asked for it. If a map with this
# name already exists (e.g. in another site file), delete these 4 lines —
# nginx refuses duplicate map names.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
