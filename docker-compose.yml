services:
  cards:
    build:
      context: .
      args:
        # baked into the client bundle at build time
        - NEXT_PUBLIC_CVPAP_API_URL=${NEXT_PUBLIC_CVPAP_API_URL:-https://api.ajiriwa.gidraf.dev}
        - NEXT_PUBLIC_CVPAP_DASHBOARD_URL=${NEXT_PUBLIC_CVPAP_DASHBOARD_URL:-https://ajiriwa.gidraf.dev}
    ports:
      - "7500:7500"
    environment:
      # server-side calls can use an internal URL (e.g. the CVPAP `web` service on a shared docker network)
      - CVPAP_API_URL=${CVPAP_API_URL:-}
      - IMAGE_PROXY_ALLOWED_HOSTS=${IMAGE_PROXY_ALLOWED_HOSTS:-minio.gidraf.dev}
    restart: unless-stopped
